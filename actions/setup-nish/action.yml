name: Set up Nish
description: >-
  Install a pinned Nish compiler and the C toolchain it links with, and put
  `nish` on PATH. The version is the `version` input, or else the repository's
  `.nish-version` file.
  Works on the GitHub-hosted Linux and macOS runners. With `wasi`, also the
  WASI sysroot that `--profile wasi` links against (Linux only).

inputs:
  version:
    description: The nish release to install, such as 0.39.0. Empty reads `version-file`.
    required: false
    default: ""
  version-file:
    description: The file holding the version when `version` is empty, relative to the workspace.
    required: false
    default: .nish-version
  wasi:
    description: Also install the WASI sysroot and compiler-rt's wasm32 builtins, so `nish --profile wasi` can link a `wasm32-wasi` module. Linux only.
    required: false
    default: "false"

outputs:
  version:
    description: The nish version installed.
    value: ${{ steps.pin.outputs.version }}
  nish:
    description: The absolute path of the installed `nish`.
    value: ${{ steps.install.outputs.nish }}

runs:
  using: composite
  steps:
    - name: Which nish
      id: pin
      shell: bash
      env:
        WANT: ${{ inputs.version }}
        FILE: ${{ inputs.version-file }}
      run: |
        version="$WANT"
        if [ -z "$version" ]; then
          if [ ! -f "$FILE" ]; then
            echo "::error::setup-nish was given no version and there is no $FILE"
            exit 1
          fi
          version="$(tr -d '[:space:]' < "$FILE")"
        fi
        # install.sh refuses anything else too; failing here names the input.
        if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::nish version \"$version\" is not a release version like 0.39.0"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/nish-$version" >> "$GITHUB_OUTPUT"

    # nish emits LLVM IR and runs clang to link it. Ubuntu's clang-18 packages
    # install only versioned commands, so the plain names are linked onto
    # PATH. macOS links with Xcode's clang, which every GitHub macOS image has.
    - name: LLVM 18 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clang-18 lld-18 llvm-18
        bin="$RUNNER_TEMP/llvm-bin"
        mkdir -p "$bin"
        for tool in clang llc opt llvm-as ld.lld wasm-ld; do
          ln -sf "/usr/bin/$tool-18" "$bin/$tool"
        done
        echo "$bin" >> "$GITHUB_PATH"

    # Ubuntu packages the sysroot into /usr (/usr/include/wasm32-wasi,
    # /usr/lib/wasm32-wasi), which nish's build.sh does not look in by
    # itself, so WASI_SYSROOT names it.
    - name: WASI sysroot (Linux)
      if: inputs.wasi == 'true'
      shell: bash
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        if [ "$RUNNER_OS_NAME" != "Linux" ]; then
          echo "::error::setup-nish installs the WASI sysroot on Linux only; link wasm on a Linux runner"
          exit 1
        fi
        sudo apt-get install -y -qq wasi-libc libclang-rt-18-dev-wasm32
        echo "WASI_SYSROOT=/usr" >> "$GITHUB_ENV"

    - name: Install nish ${{ steps.pin.outputs.version }}
      id: install
      shell: bash
      env:
        VERSION: ${{ steps.pin.outputs.version }}
        DIR: ${{ steps.pin.outputs.dir }}
      run: |
        # The installer comes from the release's own tag, so it is pinned too.
        installer="$RUNNER_TEMP/nish-install.sh"
        curl -fsSL --retry 3 -o "$installer" "https://raw.githubusercontent.com/amritk/nish/v$VERSION/install.sh"
        # Installers since 0.40 edit shell startup files unless told not to;
        # older ones do not know the flag and never edit them.
        flags=(--dir "$DIR" --force)
        if grep -q -- '--no-modify-path' "$installer"; then flags+=(--no-modify-path); fi
        sh "$installer" "$VERSION" "${flags[@]}"
        test "$("$DIR/bin/nish" --version | head -n 1 | cut -d' ' -f1-2)" = "nish $VERSION"
        echo "$DIR/bin" >> "$GITHUB_PATH"
        echo "nish=$DIR/bin/nish" >> "$GITHUB_OUTPUT"
