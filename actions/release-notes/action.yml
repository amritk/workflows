name: Release notes
description: >-
  Render a release's notes from the `changelog/<version>.json` record the
  release train wrote and the Release PR was reviewed with, using the shared
  release-notes generator, into a Markdown file for `gh release create
  --notes-file`. The notes come from the reviewed record, not a fresh walk of
  the log that could differ by a commit.

inputs:
  version:
    description: The released version, such as 1.2.3 (no leading v).
    required: true
  directory:
    description: The repository root holding `changelog/`, relative to the workspace.
    required: false
    default: .

outputs:
  file:
    description: The path of the rendered Markdown.
    value: ${{ steps.render.outputs.file }}

runs:
  using: composite
  steps:
    - name: Render the notes
      id: render
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
          echo "::error::release-notes: \"$VERSION\" is not a version like 1.2.3"
          exit 1
        fi
        if [ ! -f "changelog/$VERSION.json" ]; then
          echo "::error::changelog/$VERSION.json is missing; a release is cut by merging the Release PR, which writes it"
          exit 1
        fi
        file="$RUNNER_TEMP/release-notes-$VERSION.md"
        node "$GITHUB_ACTION_PATH/../../tools/changelog-gen.mjs" --from-json "changelog/$VERSION.json" > "$file"
        echo "file=$file" >> "$GITHUB_OUTPUT"
