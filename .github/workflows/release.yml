# Release a package from a `v*` tag, in one of two modes.
#
#   app      build a native program on one runner per target, smoke-test every
#            binary, attach the tarballs to a GitHub release with SHA256SUMS and
#            signed build provenance, and publish it through the channels the
#            caller turns on: npm, a Homebrew tap, the AUR.
#   library  pack the package's source (a Nish library ships as source), attach
#            it to a GitHub release with provenance, and publish it to npm.
#
# A run on a `v*` tag releases. Any other run (a pull request, a manual run)
# builds, smoke-tests and packs everything, and releases and publishes nothing.
#
# Versioning: with `versioning: tag` (the default) a person pushes the tag.
# With `versioning: release-please`, the caller also calls release-please.yml,
# which keeps a release PR open and, once merging it has tagged a release,
# starts the caller's workflow on that tag. This workflow checks the
# release-please config on every run and does nothing on a push to the
# default branch, which is release-please.yml's run.
#
# Security: the jobs that run the caller's code (check, build) can read the
# repository and nothing else, and hold no secret. The jobs that publish run
# none of the caller's code: they republish the files the build attested, and
# each reads its one credential from its own GitHub environment. npm publishes
# with trusted publishing. README.md has the inputs and the one-time setup.

name: release

on:
  workflow_call:
    inputs:
      mode:
        description: "`app` builds and ships a native program; `library` ships the package's source to npm."
        type: string
        default: app
      versioning:
        description: "`tag`: a person pushes the `v*` tag. `release-please`: release-please.yml cuts the tag; this workflow checks its config and skips pushes to the default branch."
        type: string
        default: tag
      release-please-config:
        description: The release-please config, from the repository root, with `versioning` release-please.
        type: string
        default: .github/release-please-config.json
      release-please-manifest:
        description: The release-please manifest, from the repository root, with `versioning` release-please.
        type: string
        default: .github/.release-please-manifest.json
      bin:
        description: The command name and the binary's file name, in app mode. Empty uses package.json's name without its scope.
        type: string
        default: ""
      directory:
        description: The project's directory in the repository, for a repository holding more than one.
        type: string
        default: .
      test:
        description: Shell run once in `directory` on Linux before anything is built or packed, with the Nish toolchain installed when `language` is nish. A failure stops the release.
        type: string
        default: ""
      language:
        description: "`nish` installs the Nish toolchain and, with no `build`, links `entry`. `none` installs nothing."
        type: string
        default: nish
      entry:
        description: "The Nish entry point to link, with `language: nish` and no `build`."
        type: string
        default: src/main.ts
      nish-version:
        description: The nish release to build with. Empty reads `.nish-version` in `directory`.
        type: string
        default: ""
      link-flags:
        description: Extra flags for `nish <entry> --link`, such as `--profile size`.
        type: string
        default: ""
      setup:
        description: Shell run before the build on every target, in `directory`, to install what the build needs.
        type: string
        default: ""
      build:
        description: Shell that builds the binary at `$OUT`, run in `directory` with ASSET and VERSION set. Replaces the Nish link.
        type: string
        default: ""
      targets:
        description: JSON array of targets to build.
        type: string
        default: '["x86_64-linux", "aarch64-linux", "aarch64-darwin", "x86_64-darwin"]'
      include:
        description: Space-separated files from `directory` copied beside `bin/` in every release; missing ones are skipped.
        type: string
        default: LICENSE README.md THIRD_PARTY_NOTICES.md
      stage:
        description: Shell run in `directory` after the build, with STAGE (the release directory), ASSET and VERSION set, to add files beside the binary.
        type: string
        default: ""
      smoke:
        description: Shell run in an empty directory against BIN, an installed copy of the binary, with REPO set to `directory`.
        type: string
        default: ""
      check-version:
        description: Require `BIN --version` to print the version being released.
        type: boolean
        default: true
      summary:
        description: One line describing the program, for Homebrew and the AUR. Empty uses package.json's description.
        type: string
        default: ""
      homepage:
        description: The program's homepage. Empty uses package.json's homepage, then the repository.
        type: string
        default: ""
      license:
        description: An SPDX license. Empty uses package.json's license.
        type: string
        default: ""
      npm:
        description: Publish to npm under package.json's `name`; in app mode, with one package per target plus a launcher. Always on in library mode.
        type: boolean
        default: false
      npm-environment:
        description: The GitHub environment the npm job runs in, which npm trusted publishing names and which holds NPM_TOKEN for a first publish.
        type: string
        default: npm
      homebrew-tap:
        description: The tap repository (`owner/homebrew-tap`) to write a formula to. Empty skips Homebrew.
        type: string
        default: ""
      homebrew-formula:
        description: The formula's name. Empty uses `bin`.
        type: string
        default: ""
      homebrew-environment:
        description: The GitHub environment holding HOMEBREW_TAP_TOKEN.
        type: string
        default: homebrew
      aur-package:
        description: The AUR package to push a PKGBUILD to, such as `mytool-bin`. Empty skips the AUR.
        type: string
        default: ""
      aur-maintainer:
        description: The PKGBUILD's `# Maintainer:` line, such as `Name <email>`.
        type: string
        default: ""
      aur-environment:
        description: The GitHub environment holding AUR_SSH_KEY.
        type: string
        default: aur
      node-version:
        description: The Node that packs and publishes. npm trusted publishing needs the npm it bundles to be 11.5.1 or newer.
        type: string
        default: 26.13.1
    # Keep these in the environments above rather than passing them: a job in
    # this workflow that names an environment reads that environment's secrets
    # directly, so each credential reaches the one job that uses it. Passing
    # them (or `secrets: inherit`) also works.
    secrets:
      NPM_TOKEN:
        description: Only for a package's first npm publish, before trusted publishing can be configured for it.
        required: false
      HOMEBREW_TAP_TOKEN:
        description: A token that can push to `homebrew-tap` (contents read and write).
        required: false
      AUR_SSH_KEY:
        description: The private SSH key of the AUR account that maintains `aur-package`.
        required: false

permissions: {}

env:
  # Where this repository is checked out in every job, at the commit the
  # caller's `uses:` resolved to (see the plan job).
  WORKFLOWS: ${{ github.workspace }}/_workflows

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: repo/${{ inputs.directory }}
    outputs:
      workflows-repository: ${{ steps.self.outputs.repository }}
      workflows-sha: ${{ steps.self.outputs.sha }}
      mode: ${{ steps.plan.outputs.mode }}
      bin: ${{ steps.plan.outputs.bin }}
      npm: ${{ steps.plan.outputs.npm }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      versioning: ${{ steps.plan.outputs.versioning }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      check-version: ${{ steps.plan.outputs.check-version }}
      nish-version: ${{ steps.plan.outputs.nish-version }}
      rows: ${{ steps.plan.outputs.rows }}
      assets: ${{ steps.plan.outputs.assets }}
      summary: ${{ steps.plan.outputs.summary }}
      homepage: ${{ steps.plan.outputs.homepage }}
      license: ${{ steps.plan.outputs.license }}
      private: ${{ steps.plan.outputs.private }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: repo
          persist-credentials: false

      # A reusable workflow cannot see which commit of its own repository it
      # was loaded from; the job's OIDC token can. Every later job checks out
      # this repository at that commit, so its scripts and actions are the
      # ones that shipped with the workflow file the caller pinned.
      - name: Which commit of this workflow is running
        id: self
        working-directory: .
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::the release workflow needs \`id-token: write\` from its caller, to learn which commit of itself to run"
            exit 1
          fi
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=amritk-workflows" | jq -r .value)"
          claims="$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#claims} % 4 )) -ne 0 ]; do claims="$claims="; done
          claims="$(printf '%s' "$claims" | base64 -d)"
          ref="$(printf '%s' "$claims" | jq -r .job_workflow_ref)"
          sha="$(printf '%s' "$claims" | jq -r .job_workflow_sha)"
          repository="$(printf '%s' "$ref" | cut -d/ -f1-2)"
          echo "running $ref ($sha)"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.self.outputs.repository }}
          ref: ${{ steps.self.outputs.sha }}
          path: _workflows
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Version, channels and matrix
        id: plan
        env:
          MODE: ${{ inputs.mode }}
          VERSIONING: ${{ inputs.versioning }}
          RP_CONFIG: ${{ inputs.release-please-config }}
          RP_MANIFEST: ${{ inputs.release-please-manifest }}
          DIRECTORY: ${{ inputs.directory }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BIN: ${{ inputs.bin }}
          TARGETS: ${{ inputs.targets }}
          DRY_RUN_EVENT: ${{ github.event_name }}
          PRIVATE: ${{ github.event.repository.private }}
          LANGUAGE: ${{ inputs.language }}
          NISH_VERSION: ${{ inputs.nish-version }}
          CHECK_VERSION: ${{ inputs.check-version }}
          NPM: ${{ inputs.npm }}
          TAP: ${{ inputs.homebrew-tap }}
          AUR: ${{ inputs.aur-package }}
          SUMMARY: ${{ inputs.summary }}
          HOMEPAGE: ${{ inputs.homepage }}
          LICENSE: ${{ inputs.license }}
        run: |
          pkg() { if [ -f package.json ]; then node -p "require('./package.json')$1 ?? ''"; fi; }
          case "$MODE" in
            app | library) ;;
            *) echo "::error::mode is \"$MODE\"; it is app or library"; exit 1 ;;
          esac
          bin="${BIN:-$(pkg .name | sed 's#^@[^/]*/##')}"
          if [ "$MODE" = "app" ] && [ -z "$bin" ]; then
            echo "::error::app mode needs a command name: set bin, or a name in package.json"
            exit 1
          fi
          if [ "$MODE" = "library" ]; then
            NPM=true
            if [ -n "$TAP" ] || [ -n "$AUR" ]; then
              echo "::error::a library ships to npm only; Homebrew and the AUR install programs, so use mode app"
              exit 1
            fi
          fi
          pkg_version="$(pkg .version)"

          # Which run this is: a release (a v* tag), a release-please run (a
          # push to the default branch), or a dry run (anything else).
          case "$VERSIONING" in
            tag) ;;
            release-please)
              root="$GITHUB_WORKSPACE/repo"
              for f in "$RP_CONFIG" "$RP_MANIFEST"; do
                test -f "$root/$f" || { echo "::error::versioning is release-please but there is no $f; see this workflow's README, \"Versioning\""; exit 1; }
              done
              node "$WORKFLOWS/tools/release.mjs" release-please "$root/$RP_CONFIG" "$root/$RP_MANIFEST" "$DIRECTORY" "$pkg_version"
              ;;
            changesets) echo "::error::versioning changesets is not supported yet; use tag or release-please"; exit 1 ;;
            *) echo "::error::versioning is \"$VERSIONING\"; it is tag or release-please"; exit 1 ;;
          esac
          if [ "$VERSIONING" = "release-please" ] && [ "$GITHUB_EVENT_NAME" = "push" ] \
            && [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            versioning_run=release-please
          else
            versioning_run=""
          fi

          if [ -n "$versioning_run" ]; then
            publish=false
            version="${pkg_version:-0.0.0}"
            check=false
            echo "::notice::a push to $GITHUB_REF_NAME: release-please.yml updates the release PR, and the release runs on the tag merging it creates"
          elif [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            publish=true
            version="${GITHUB_REF_NAME#v}"
            if [ -n "$pkg_version" ] && [ "$pkg_version" != "$version" ]; then
              echo "::error::the tag is $GITHUB_REF_NAME but package.json's version is $pkg_version"
              exit 1
            fi
            check="$CHECK_VERSION"
          else
            publish=false
            version="${pkg_version:-0.0.0}"
            check="$CHECK_VERSION"
            if [ -z "$pkg_version" ]; then check=false; fi
            echo "::notice::not a v* tag ($DRY_RUN_EVENT on $GITHUB_REF_NAME): building $version on every target and releasing nothing"
          fi

          # The compiler is required to build an app; a library needs it only
          # for its test hook, so there it is installed when it is pinned.
          nish=""
          case "$LANGUAGE" in
            nish)
              nish="$NISH_VERSION"
              if [ -z "$nish" ] && [ -f .nish-version ]; then nish="$(tr -d '[:space:]' < .nish-version)"; fi
              if [ -z "$nish" ] && [ "$MODE" = "app" ]; then
                echo "::error::language is nish but there is no nish-version input and no .nish-version file"
                exit 1
              fi
              ;;
            none) ;;
            *) echo "::error::language is \"$LANGUAGE\"; it is nish or none"; exit 1 ;;
          esac

          if [ "$NPM" = "true" ] && [ -z "$(pkg .name)" ]; then
            echo "::error::npm publishes under package.json's name, and there is no package.json with one"
            exit 1
          fi
          private="${PRIVATE:-false}"
          if [ "$private" = "true" ] && { [ -n "$TAP" ] || [ -n "$AUR" ]; }; then
            # Homebrew and the AUR download the release's tarballs anonymously.
            echo "::error::Homebrew and the AUR need a public repository: they download the release tarballs, which a private repository's release does not serve to anyone signed out"
            exit 1
          fi
          summary="${SUMMARY:-$(pkg .description)}"
          if { [ -n "$TAP" ] || [ -n "$AUR" ]; } && [ -z "$summary" ]; then
            echo "::error::Homebrew and the AUR need a one-line summary: set the summary input or package.json's description"
            exit 1
          fi

          rows="$(node "$WORKFLOWS/tools/release.mjs" rows "$TARGETS")"
          {
            echo "mode=$MODE"
            echo "bin=$bin"
            echo "npm=$NPM"
            echo "version=$version"
            echo "publish=$publish"
            echo "versioning=$versioning_run"
            # 1.2.0-rc.1 is a prerelease: marked so on GitHub, published to
            # npm under the `next` dist-tag, and kept out of Homebrew and the AUR.
            case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac
            echo "check-version=$check"
            echo "nish-version=${nish:-}"
            echo "rows=$rows"
            echo "assets=$(printf '%s' "$rows" | jq -r '[.[].asset] | join(" ")')"
            echo "summary=$summary"
            echo "homepage=${HOMEPAGE:-$(pkg .homepage)}"
            echo "license=${LICENSE:-$(pkg .license)}"
            echo "private=$private"
          } >> "$GITHUB_OUTPUT"
          echo "$MODE $bin $version, publish $publish"
          if [ "$MODE" = "app" ]; then printf '%s' "$rows" | jq -r '.[] | "\(.asset) on \(.runner)"'; fi

  # The caller's own checks, once, before anything is built or packed. Holds
  # no secret. Skipped on a push release-please.yml handles.
  check:
    name: check
    needs: plan
    if: needs.plan.outputs.versioning == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: repo/${{ inputs.directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: inputs.test != ''
        with:
          path: repo
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: inputs.test != '' && needs.plan.outputs.nish-version != ''
        with:
          repository: ${{ needs.plan.outputs.workflows-repository }}
          ref: ${{ needs.plan.outputs.workflows-sha }}
          path: _workflows
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: inputs.test != ''
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up Nish
        if: inputs.test != '' && needs.plan.outputs.nish-version != ''
        uses: ./_workflows/actions/setup-nish
        with:
          version: ${{ needs.plan.outputs.nish-version }}

      - name: Test hook
        if: inputs.test != ''
        run: ${{ inputs.test }}

      - name: No test hook
        if: inputs.test == ''
        working-directory: .
        run: echo "no test input; the release relies on the repository's own CI"

  build:
    name: build (${{ matrix.target.asset }})
    if: needs.plan.outputs.mode == 'app'
    needs: [plan, check]
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.rows) }}
    defaults:
      run:
        working-directory: repo/${{ inputs.directory }}
    env:
      ASSET: ${{ matrix.target.asset }}
      BIN: ${{ needs.plan.outputs.bin }}
      VERSION: ${{ needs.plan.outputs.version }}
      CHECK_VERSION: ${{ needs.plan.outputs.check-version }}
      REPO: ${{ github.workspace }}/repo/${{ inputs.directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: repo
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.plan.outputs.workflows-repository }}
          ref: ${{ needs.plan.outputs.workflows-sha }}
          path: _workflows
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: The runner is the platform the target names
        env:
          WANT_HOST: ${{ matrix.target.host }}
        run: |
          actual="$(uname -s)-$(uname -m)"
          if [ "$actual" != "$WANT_HOST" ]; then
            echo "::error::this runner is $actual, but $ASSET is built on $WANT_HOST"
            exit 1
          fi

      - name: Set up Nish
        if: inputs.language == 'nish'
        uses: ./_workflows/actions/setup-nish
        with:
          version: ${{ needs.plan.outputs.nish-version }}

      - name: Setup hook
        if: inputs.setup != ''
        run: ${{ inputs.setup }}

      - name: Build
        id: build
        env:
          BUILD: ${{ inputs.build }}
          LANGUAGE: ${{ inputs.language }}
          ENTRY: ${{ inputs.entry }}
          LINK_FLAGS: ${{ inputs.link-flags }}
          INCLUDE: ${{ inputs.include }}
        run: |
          name="$BIN-$VERSION-$ASSET"
          stage="$RUNNER_TEMP/release/$name"
          scratch="$RUNNER_TEMP/link"
          mkdir -p "$stage/bin" "$scratch" "$RUNNER_TEMP/out"
          export OUT="$scratch/$BIN"
          if [ -n "$BUILD" ]; then
            bash -euo pipefail -c "$BUILD"
          elif [ "$LANGUAGE" = "nish" ]; then
            # --link leaves IR and per-module files beside its output, so it
            # links in a scratch directory and only the binary is staged.
            # shellcheck disable=SC2086 # LINK_FLAGS is a list of flags
            nish "$ENTRY" --link "$OUT" $LINK_FLAGS
          else
            echo "::error::language is none, so the build input has to say how to build"
            exit 1
          fi
          test -x "$OUT" || { echo "::error::the build wrote no executable at \$OUT ($OUT)"; exit 1; }
          cp "$OUT" "$stage/bin/$BIN"
          for f in $INCLUDE; do
            if [ -e "$f" ]; then cp -R "$f" "$stage/"; fi
          done
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Stage hook
        if: inputs.stage != ''
        env:
          STAGE: ${{ steps.build.outputs.stage }}
        run: ${{ inputs.stage }}

      - name: Tarball
        id: tarball
        env:
          NAME: ${{ steps.build.outputs.name }}
        run: |
          tarball="$RUNNER_TEMP/out/$NAME.tar.gz"
          tar -czf "$tarball" -C "$RUNNER_TEMP/release" "$NAME"
          mkdir -p "$RUNNER_TEMP/unpack" "$RUNNER_TEMP/smoke"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/unpack"
          echo "bin=$RUNNER_TEMP/unpack/$NAME/bin/$BIN" >> "$GITHUB_OUTPUT"
          tar -tzvf "$tarball"

      - name: The unpacked binary runs
        env:
          UNPACKED: ${{ steps.tarball.outputs.bin }}
        run: |
          out="$("$UNPACKED" --version)"
          echo "$out"
          if [ "$CHECK_VERSION" = "true" ]; then
            case "$out" in
              *"$VERSION"*) ;;
              *) echo "::error::$BIN --version printed \"$out\", which does not name $VERSION"; exit 1 ;;
            esac
          fi

      - name: Smoke the unpacked binary
        if: inputs.smoke != ''
        working-directory: ${{ runner.temp }}/smoke
        env:
          BIN: ${{ steps.tarball.outputs.bin }}
        run: ${{ inputs.smoke }}

      - name: npm packages
        id: npm
        if: needs.plan.outputs.npm == 'true'
        env:
          STAGE: ${{ steps.build.outputs.stage }}
          ASSETS: ${{ needs.plan.outputs.assets }}
        run: |
          name="$(node -p "require('./package.json').name")"
          node "$WORKFLOWS/tools/release.mjs" platform "$STAGE" "$ASSET" "$VERSION" "$name" > /dev/null
          platform="$(npm pack "$STAGE" --pack-destination "$RUNNER_TEMP/out" --ignore-scripts --json | jq -r '.[0].filename')"
          # The launcher package is packed here only to install it below; the
          # release job packs the one it publishes.
          # shellcheck disable=SC2086 # ASSETS is a list
          main="$(node "$WORKFLOWS/tools/release.mjs" main "$RUNNER_TEMP/try" "$BIN" "$VERSION" $ASSETS)"
          project="$RUNNER_TEMP/npm-install"
          mkdir -p "$project"
          (cd "$project" && npm init -y > /dev/null && npm install --no-audit --no-fund "$RUNNER_TEMP/out/$platform" "$main")
          echo "platform=$RUNNER_TEMP/out/$platform" >> "$GITHUB_OUTPUT"
          echo "bin=$project/node_modules/.bin/$BIN" >> "$GITHUB_OUTPUT"
          out="$("$project/node_modules/.bin/$BIN" --version)"
          echo "$out"
          if [ "$CHECK_VERSION" = "true" ]; then
            case "$out" in
              *"$VERSION"*) ;;
              *) echo "::error::the npm-installed $BIN --version printed \"$out\""; exit 1 ;;
            esac
          fi

      - name: Smoke the npm-installed command
        if: needs.plan.outputs.npm == 'true' && inputs.smoke != ''
        working-directory: ${{ runner.temp }}/smoke
        env:
          BIN: ${{ steps.npm.outputs.bin }}
        run: ${{ inputs.smoke }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target.asset }}
          path: |
            ${{ runner.temp }}/out/${{ steps.build.outputs.name }}.tar.gz
            ${{ steps.npm.outputs.platform }}
          if-no-files-found: error
          retention-days: 3

  # Packs the release's files and every channel's, publishing nothing unless
  # this is a tag. On a pull request it is the check that the formula and the
  # PKGBUILD can still be written.
  release:
    name: release
    # A library has no build job; it is skipped, not failed.
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.check.result == 'success'
      && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.plan.outputs.mode == 'library'))
    needs: [plan, check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: repo/${{ inputs.directory }}
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    env:
      BIN: ${{ needs.plan.outputs.bin }}
      VERSION: ${{ needs.plan.outputs.version }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      # A job's env cannot read the runner context, so DIST is set here.
      - name: Where the release's files gather
        working-directory: .
        run: echo "DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: repo
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.plan.outputs.workflows-repository }}
          ref: ${{ needs.plan.outputs.workflows-sha }}
          path: _workflows
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      # Outside the checkout, so packing the project can never pick these up.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.mode == 'app'
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      - name: Every target's tarball is here
        if: needs.plan.outputs.mode == 'app'
        env:
          ASSETS: ${{ needs.plan.outputs.assets }}
        run: |
          for asset in $ASSETS; do
            test -s "$DIST/$BIN-$VERSION-$asset.tar.gz" || { echo "::error::no tarball for $asset"; exit 1; }
          done
          ls -l "$DIST"

      - name: The library's npm package
        if: needs.plan.outputs.mode == 'library'
        run: |
          node "$WORKFLOWS/tools/release.mjs" library "$DIST" "$VERSION"

      - name: The npm launcher package
        if: needs.plan.outputs.mode == 'app' && needs.plan.outputs.npm == 'true'
        env:
          ASSETS: ${{ needs.plan.outputs.assets }}
        run: |
          # shellcheck disable=SC2086 # ASSETS is a list
          node "$WORKFLOWS/tools/release.mjs" main "$DIST" "$BIN" "$VERSION" $ASSETS

      - name: SHA256SUMS
        id: sums
        working-directory: ${{ runner.temp }}/dist
        run: |
          shopt -s nullglob
          files=(*.tar.gz *.tgz)
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          { echo "sums<<SHA256SUMS_END"; cat SHA256SUMS; echo "SHA256SUMS_END"; } >> "$GITHUB_OUTPUT"

      - name: The Homebrew formula and the AUR package can be written
        if: inputs.homebrew-tap != '' || inputs.aur-package != ''
        env:
          REPOSITORY: ${{ github.repository }}
          FORMULA: ${{ inputs.homebrew-formula || needs.plan.outputs.bin }}
          AUR_PACKAGE: ${{ inputs.aur-package }}
          SUMMARY: ${{ needs.plan.outputs.summary }}
          HOMEPAGE: ${{ needs.plan.outputs.homepage }}
          LICENSE: ${{ needs.plan.outputs.license }}
        run: |
          common=(--bin "$BIN" --version "$VERSION" --tag "v$VERSION" --repo "$REPOSITORY" --summary "$SUMMARY" --homepage "$HOMEPAGE" --license "$LICENSE" --sums "$DIST/SHA256SUMS")
          node "$WORKFLOWS/tools/release.mjs" formula --name "$FORMULA" "${common[@]}"
          if [ -n "$AUR_PACKAGE" ]; then
            node "$WORKFLOWS/tools/release.mjs" aur "$RUNNER_TEMP/aur-check" --package "$AUR_PACKAGE" "${common[@]}"
          fi

      - name: Attest build provenance
        if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.private != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/dist/SHA256SUMS

      - name: GitHub release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          # release-please (or a person) may have created the release already;
          # then keep its notes and add the files. A re-run replaces them.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DIST"/* --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease
            fi
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$DIST"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "${BIN:-$GITHUB_REPOSITORY} $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"

  npm:
    name: npm
    # A job's `if` without a status function is `success() && …`, and success()
    # fails when any job upstream was skipped: in library mode that is build, two
    # jobs up, so it would never run. Gate on release, which already decided
    # whether build's result lets the release go ahead.
    if: >-
      !cancelled() && needs.release.result == 'success'
      && needs.plan.outputs.npm == 'true' && needs.plan.outputs.publish == 'true'
    needs: [plan, release]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.npm-environment }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: npm new enough for trusted publishing
        run: |
          v="$(npm --version)"
          echo "npm $v"
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $v predates trusted publishing (11.5.1); raise node-version"
            exit 1
          fi

      - name: The packages the release attached, as attached
        env:
          GH_TOKEN: ${{ github.token }}
          SUMS: ${{ needs.release.outputs.sums }}
        run: |
          mkdir -p npm
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir npm
          printf '%s\n' "$SUMS" | grep '\.tgz$' > npm/expected.sums
          (cd npm && sha256sum -c expected.sums)

      - name: Publish, platforms first
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_ENVIRONMENT: ${{ inputs.npm-environment }}
          PRIVATE: ${{ needs.plan.outputs.private }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            # Only for a first publish. The file holds the literal
            # ${NPM_TOKEN}, which npm expands itself, so the token is never
            # written to disk.
            printf '%s\n' "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          fi
          provenance=--provenance
          if [ "$PRIVATE" = "true" ]; then
            provenance=--no-provenance
            echo "::notice::a private repository gets no npm provenance"
          fi
          dist_tag=latest
          if [ "$PRERELEASE" = "true" ]; then dist_tag=next; fi
          main=""
          order=()
          for tgz in npm/*.tgz; do
            if tar -xzOf "$tgz" package/package.json | jq -e '.os' > /dev/null; then
              order+=("$tgz")
            else
              main="$tgz"
            fi
          done
          test -n "$main" || { echo "::error::the release attached no launcher package"; exit 1; }
          order+=("$main")
          for tgz in "${order[@]}"; do
            name="$(tar -xzOf "$tgz" package/package.json | jq -r .name)"
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already on the registry; skipping"
              continue
            fi
            if ! npm view "$name" name > /dev/null 2>&1 && [ -z "$NPM_TOKEN" ]; then
              echo "::error::$name has never been published, so it cannot trust this workflow yet. Pass the NPM_TOKEN secret for its first release, then configure trusted publishing for $GITHUB_REPOSITORY with workflow file $(basename "${GITHUB_WORKFLOW_REF%@*}") and environment $NPM_ENVIRONMENT."
              exit 1
            fi
            npm publish "$tgz" --access public --tag "$dist_tag" "$provenance"
          done

  homebrew:
    name: homebrew
    # Gated on release's result, as npm is.
    if: >-
      !cancelled() && needs.release.result == 'success'
      && inputs.homebrew-tap != '' && needs.plan.outputs.publish == 'true' && needs.plan.outputs.prerelease != 'true'
    needs: [plan, release]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.homebrew-environment }}
    permissions:
      contents: read
    env:
      BIN: ${{ needs.plan.outputs.bin }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAP: ${{ inputs.homebrew-tap }}
      FORMULA: ${{ inputs.homebrew-formula || needs.plan.outputs.bin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.plan.outputs.workflows-repository }}
          ref: ${{ needs.plan.outputs.workflows-sha }}
          path: _workflows
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Write the formula
        env:
          SUMS: ${{ needs.release.outputs.sums }}
          SUMMARY: ${{ needs.plan.outputs.summary }}
          HOMEPAGE: ${{ needs.plan.outputs.homepage }}
          LICENSE: ${{ needs.plan.outputs.license }}
        run: |
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/SHA256SUMS"
          node "$WORKFLOWS/tools/release.mjs" formula --name "$FORMULA" --bin "$BIN" --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --summary "$SUMMARY" --homepage "$HOMEPAGE" \
            --license "$LICENSE" --sums "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/formula.rb"
          cat "$RUNNER_TEMP/formula.rb"

      # Plain git rather than actions/checkout, which cannot check out a tap
      # that has no commits yet.
      - name: Push it to the tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "::error::homebrew-tap is set but the HOMEBREW_TAP_TOKEN secret is not"; exit 1; }
          git init -q tap && cd tap
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/$TAP.git"
          branch="$(git ls-remote --symref origin HEAD | sed -n 's#^ref: refs/heads/\(.*\)\tHEAD$#\1#p')"
          if [ -n "$branch" ]; then
            git fetch -q --depth 1 origin "$branch"
            git checkout -q -B "$branch" FETCH_HEAD
          else
            branch=main
            git checkout -q -b "$branch"
          fi
          mkdir -p Formula
          cp "$RUNNER_TEMP/formula.rb" "Formula/$FORMULA.rb"
          git add "Formula/$FORMULA.rb"
          if git diff --cached --quiet; then
            echo "Formula/$FORMULA.rb is already $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$FORMULA $VERSION" -m "From $GITHUB_REPOSITORY $GITHUB_REF_NAME."
          git push -q origin "HEAD:$branch"
          echo "pushed Formula/$FORMULA.rb to $TAP ($branch)"

  aur:
    name: aur
    # Gated on release's result, as npm is.
    if: >-
      !cancelled() && needs.release.result == 'success'
      && inputs.aur-package != '' && needs.plan.outputs.publish == 'true' && needs.plan.outputs.prerelease != 'true'
    needs: [plan, release]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.aur-environment }}
    permissions:
      contents: read
    env:
      BIN: ${{ needs.plan.outputs.bin }}
      VERSION: ${{ needs.plan.outputs.version }}
      PACKAGE: ${{ inputs.aur-package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.plan.outputs.workflows-repository }}
          ref: ${{ needs.plan.outputs.workflows-sha }}
          path: _workflows
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Trust aur.archlinux.org by its published host key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          test -n "$AUR_SSH_KEY" || { echo "::error::aur-package is set but the AUR_SSH_KEY secret is not"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org > "$RUNNER_TEMP/aur.keys" 2> /dev/null
          want="$(node --input-type=module -e "import { AUR_HOST_KEY } from '$WORKFLOWS/tools/release.mjs'; console.log(AUR_HOST_KEY)")"
          got="$(ssh-keygen -lf "$RUNNER_TEMP/aur.keys" | awk '{ print $2 }')"
          if [ "$got" != "$want" ]; then
            echo "::error::aur.archlinux.org presented host key $got, not the published $want"
            exit 1
          fi
          cat "$RUNNER_TEMP/aur.keys" >> ~/.ssh/known_hosts

      - name: Write the PKGBUILD and push it
        env:
          SUMS: ${{ needs.release.outputs.sums }}
          SUMMARY: ${{ needs.plan.outputs.summary }}
          HOMEPAGE: ${{ needs.plan.outputs.homepage }}
          LICENSE: ${{ needs.plan.outputs.license }}
          MAINTAINER: ${{ inputs.aur-maintainer }}
        run: |
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # The AUR serves a package that does not exist yet as an empty
          # repository, and the first push creates it.
          git clone -q "ssh://aur@aur.archlinux.org/$PACKAGE.git" aur
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/SHA256SUMS"
          maintainer=()
          if [ -n "$MAINTAINER" ]; then maintainer=(--maintainer "$MAINTAINER"); fi
          node "$WORKFLOWS/tools/release.mjs" aur aur --package "$PACKAGE" --bin "$BIN" --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --summary "$SUMMARY" --homepage "$HOMEPAGE" \
            --license "$LICENSE" --sums "$RUNNER_TEMP/SHA256SUMS" "${maintainer[@]}"
          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "$PACKAGE is already $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$VERSION" -m "From $GITHUB_REPOSITORY $GITHUB_REF_NAME."
          git push -q origin HEAD:master
          echo "pushed $PACKAGE $VERSION to the AUR"
