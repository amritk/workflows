# Tests this repository: the packaging tools' unit tests, actionlint over the
# workflows, and the release workflow itself, run end to end on test/hello as
# an app on every target (and as a wasm32-wasi module) with every channel
# turned on, as a library, and as a
# library versioned by release-please (its config checked). Off a tag that
# run builds, smoke-tests and packs everything and publishes nothing, and
# this workflow never runs on a tag, so it cannot publish test/hello.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  tools:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Unit tests
        run: node --test 'tools/*.test.mjs'

  actionlint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  app-dry-run:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      bin: hello
      directory: test/hello
      smoke: '"$BIN" | grep -qx "hello 0.1.0"'
      npm: true
      homebrew-tap: amritk/homebrew-tap
      aur-package: amritk-workflows-hello-bin
      wasm: true

  library-dry-run:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      mode: library
      directory: test/hello
      test: nish src/main.ts -o "$RUNNER_TEMP/hello.ll"

  # Checks test/hello's release-please config the way a caller's is checked on
  # every run. CI never calls release-please.yml, which would open release PRs
  # and push tags here.
  release-please-dry-run:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      mode: library
      directory: test/hello
      versioning: release-please
      release-please-config: test/hello/release-please-config.json
      release-please-manifest: test/hello/.release-please-manifest.json

  # The one check to require: green only when every job above succeeded.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [tools, actionlint, app-dry-run, library-dry-run, release-please-dry-run]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
