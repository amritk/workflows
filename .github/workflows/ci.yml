# Tests this repository: the packaging tools' unit tests, actionlint over the
# workflows, and the release workflow itself, run end to end on test/hello as
# an app on every target with every channel turned on, and as a library. Off a tag that
# run builds, smoke-tests and packs everything and publishes nothing, and
# this workflow never runs on a tag, so it cannot publish test/hello.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  tools:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.1
      - name: Unit tests
        run: node --test 'tools/*.test.mjs'

  actionlint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  app-dry-run:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      bin: hello
      directory: test/hello
      smoke: '"$BIN" | grep -qx "hello 0.1.0"'
      npm: true
      homebrew-tap: amritk/homebrew-tap
      aur-package: amritk-workflows-hello-bin

  library-dry-run:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      mode: library
      directory: test/hello
      test: nish src/main.ts -o "$RUNNER_TEMP/hello.ll"
