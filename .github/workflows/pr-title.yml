# This repository's own pull request titles, checked by its own action:
# release-please cuts versions from the squash-merge subjects, which are the
# titles. Callers use the action pinned by commit, as README.md shows.
name: PR title

on:
  pull_request:
    # `edited` clears the red check when the title is fixed.
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions: {}

jobs:
  check:
    name: conventional title
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/pr-title
